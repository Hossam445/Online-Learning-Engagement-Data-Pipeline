services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    environment:
      - CLUSTER_NAME=learning-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - HDFS_CONF_dfs_replication=1
    ports:
      - "9870:9870"
    volumes:
      - namenode-data:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    hostname: datanode
    depends_on:
      - namenode
    environment:
      - CLUSTER_NAME=learning-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - HDFS_CONF_dfs_replication=1
      - SERVICE_PRECONDITION=namenode:9870
    volumes:
      - datanode-data:/hadoop/dfs/data

  flume:
    build: ./flume
    container_name: flume
    depends_on:
      - namenode
      - datanode
    environment:
      - CLUSTER_NAME=learning-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - HDFS_CONF_dfs_replication=1
      - SERVICE_PRECONDITION=namenode:9870 datanode:9864
    volumes:
      - ./flume/flume.conf:/flume-conf/flume.conf:ro
      - ./data:/data:ro
    command: /run-agent.sh
    # The base image healthcheck expects a NameNode; Flume does not run one.
    healthcheck:
      disable: true

  spark:
    image: apache/spark:3.5.5
    container_name: spark
    user: root
    depends_on:
      - namenode
      - datanode
    environment:
      - PATH=/opt/spark/bin:/opt/spark/sbin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ./spark/analysis.py:/app/analysis.py:ro
    command: tail -f /dev/null

volumes:
  namenode-data:
  datanode-data: