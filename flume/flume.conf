# Apache Flume agent configuration.
# Architecture: Source -> Channel -> HDFS Sink
#
#   SpoolingDirectorySource (reads a CSV file dropped into /flume-spool)
#           |
#           v
#        MemoryChannel
#           |
#           v
#        HDFS Sink  (writes events to HDFS)
#
# Agent name: agent

agent.sources = spool
agent.channels = mem
agent.sinks = hdfs

# ---------------- Source: Spooling directory ----------------
# Watches /flume-spool and ingests every new file placed there.
agent.sources.spool.type = spooldir
agent.sources.spool.spoolDir = /flume-spool
agent.sources.spool.fileHeader = false
agent.sources.spool.basenameHeader = true

# ---------------- Channel: In-memory ----------------
agent.channels.mem.type = memory
agent.channels.mem.capacity = 10000
agent.channels.mem.transactionCapacity = 10000

# ---------------- Sink: HDFS ----------------
agent.sinks.hdfs.type = hdfs
agent.sinks.hdfs.hdfs.path = hdfs://namenode:8020/data/online-learning/raw/
agent.sinks.hdfs.hdfs.fileType = DataStream
agent.sinks.hdfs.hdfs.writeFormat = Text
agent.sinks.hdfs.hdfs.filePrefix = learning
# Write everything into a single file (no time/size/count based rolling).
agent.sinks.hdfs.hdfs.rollInterval = 0
agent.sinks.hdfs.hdfs.rollSize = 0
agent.sinks.hdfs.hdfs.rollCount = 0
# Close (rename from .tmp) the file once ingestion stops.
agent.sinks.hdfs.hdfs.idleTimeout = 60
agent.sinks.hdfs.hdfs.batchSize = 1000

# ---------------- Wire source -> channel -> sink ----------------
agent.sources.spool.channels = mem
agent.sinks.hdfs.channel = mem